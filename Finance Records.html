    <style>:root {
  color-scheme: light;
  --paper: #f4f5fb;
  --surface: #fff;
  --ink: #252941;
  --muted: #667085;
  --line: #dce1ed;
  --accent: #5148b5;
  --accent-dark: #40368f;
  --accent-pale: #eeecfb;
  --expense: #ad465f;
  --expense-pale: #fbeef1;
  --red: #b23d55;
  --gain: #2864a7;
  --gain-pale: #eaf2fb;
  --radius: 9px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-size: 14px;
  font-synthesis: none;
}
.inline-category-button {
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 11px;
  padding: 5px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.records-section .filter-bar {
  display: block;
}
.filter-main {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) minmax(120px, 160px) minmax(140px, 200px);
  gap: 9px;
}
.filter-main .search-field {
  min-width: 0;
}
.filter-main > .filter-field {
  width: auto;
  min-width: 0;
}
.filter-dates {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 11px;
}
.filter-dates > .month-field {
  flex: 0 0 148px;
  width: 148px;
  min-width: 0;
}
.filter-dates label {
  display: block;
  font-size: 10px;
  font-weight: 550;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 6px;
}
.date-range-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  flex: 0 1 337px;
  min-width: 0;
}
.date-filter-field {
  min-width: 0;
}
.filter-dates > .reset-filters {
  flex: none;
  align-self: flex-end;
  margin: 0 0 0 auto;
  padding: 11px 6px;
  line-height: 17px;
}
.date-range-fields input[aria-invalid='true'] {
  border-color: var(--red);
  background: #fff9fa;
}
#date-range-error {
  margin: -2px 0 13px;
}
@media (max-width: 600px) {
  .filter-main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }
  .filter-main > .search-field {
    grid-column: 1 / -1;
  }
  .filter-dates {
    gap: 7px;
    margin-top: 10px;
  }
  .filter-dates > .month-field {
    flex: 1 1 100px;
    width: auto;
  }
  .date-range-fields {
    flex: 2 1 210px;
    gap: 7px;
  }
  .filter-dates label {
    font-size: 9px;
    margin-bottom: 5px;
  }
  .filter-dates input {
    padding: 0 6px;
  }
  .filter-dates > .reset-filters {
    font-size: 10px;
    padding: 5px 4px;
    line-height: 17px;
  }
  #date-range-error {
    font-size: 10px;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
summary,
a {
  -webkit-tap-highlight-color: transparent;
}
button,
summary {
  cursor: pointer;
}
button {
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.4;
}
button svg,
summary svg {
  width: 18px;
  height: 18px;
  flex: none;
}
svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.55;
  stroke-linecap: round;
  stroke-linejoin: round;
}
input,
select,
textarea {
  min-width: 0;
}
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
button:focus-visible,
summary:focus-visible,
a:focus-visible {
  outline: 3px solid #8d83e4;
  outline-offset: 3px;
}
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-offset: 0;
}
input::placeholder,
textarea::placeholder {
  color: #667085;
  opacity: 1;
}
[hidden] {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: absolute;
  top: -100px;
  left: 20px;
  background: var(--accent);
  color: white;
  padding: 12px;
  z-index: 100;
}
.skip-link:focus {
  top: 12px;
}
.app-header {
  background: #ffffff;
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1240px;
  margin: auto;
  min-height: 88px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 17px 36px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 39px;
  height: 43px;
  border-radius: 8px 8px 16px 8px;
  background: var(--accent);
  color: #f3f1ff;
}
.brand-mark svg {
  width: 27px;
  height: 27px;
  stroke-width: 1.4;
}
.brand-name {
  display: block;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.5px;
}
.brand-caption {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.currency-label {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.header-divider {
  height: 22px;
  width: 1px;
  background: var(--line);
  margin: 0 7px;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 11px 16px;
  font-size: 13px;
  line-height: 19px;
  font-weight: 550;
  text-decoration: none;
  white-space: nowrap;
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
.button:active:not(:disabled) {
  transform: translateY(1px);
}
.button-primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 1px 2px #322b791a;
}
.button-primary:hover {
  background: var(--accent-dark);
}
.button-outline {
  background: var(--surface);
  border-color: #d8ddeb;
}
.button-outline:hover {
  background: #f0effb;
  border-color: #b8b6db;
}
.button-quiet {
  background: transparent;
}
.button-quiet:hover {
  background: #e9eaf5;
}
.button-ink {
  color: white;
  background: var(--ink);
}
.button-ink:hover {
  background: #3c4260;
}
.button-compact {
  padding: 8px 12px;
  font-size: 12px;
}
.button-danger {
  color: white;
  background: var(--red);
}
.button-danger:hover {
  background: #923048;
}
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  width: 32px;
  height: 32px;
  padding: 6px;
  color: var(--muted);
}
.icon-button:hover:not(:disabled) {
  background: var(--accent-pale);
  color: var(--accent);
}
.workspace {
  max-width: 1240px;
  padding: 28px 36px 20px;
  margin: auto;
}
.file-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8f8fe;
  padding: 13px 16px;
}
.file-details {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.file-icon {
  color: #71799a;
  flex: none;
}
.file-icon svg {
  display: block;
  width: 25px;
  height: 29px;
}
.file-copy {
  min-width: 0;
}
.file-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
#file-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
  max-width: 430px;
}
.save-status {
  font-size: 10px;
  font-weight: 550;
  white-space: nowrap;
  padding: 3px 7px;
  border-radius: 5px;
  background: #e9effa;
  color: #51648a;
}
.save-status.unsaved,
.save-status.dirty {
  background: #fff0db;
  color: #885c18;
}
.file-copy p {
  font-size: 11px;
  color: var(--muted);
  margin: 4px 0 0;
  line-height: 1.5;
}
.file-actions {
  display: flex;
  gap: 7px;
  align-items: center;
  flex: none;
}
.file-menu {
  position: relative;
}
.file-menu summary {
  list-style: none;
}
.file-menu summary::-webkit-details-marker {
  display: none;
}
.file-menu summary svg {
  width: 16px;
  height: 19px;
}
.menu-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 7px);
  width: 185px;
  z-index: 10;
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 5px;
  box-shadow: 0 10px 30px #22264a14;
}
.menu-panel button {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 5px;
  text-align: left;
  background: white;
  padding: 10px 11px;
  font-size: 12px;
  font-weight: 550;
}
.menu-panel button:hover {
  background: var(--accent-pale);
}
.menu-panel span {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 3px;
}
.message {
  margin-top: 16px;
  padding: 12px 14px;
  border: 1px solid #d6d2f4;
  border-radius: 8px;
  color: var(--accent);
  background: #f0eefc;
  font-size: 12px;
  line-height: 1.5;
}
.message.error {
  background: #fff0f3;
  border-color: #edc4ce;
  color: #9c3450;
}
.message.warning {
  background: #fff6e8;
  border-color: #ead3ad;
  color: #855b20;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 40px 0 31px;
}
.eyebrow {
  font-size: 9px;
  line-height: 1.5;
  font-weight: 650;
  letter-spacing: 0.14em;
  color: #667085;
  margin: 0 0 9px;
}
h1,
h2,
h3,
p {
  overflow-wrap: break-word;
}
h1 {
  font-family: Georgia, 'Times New Roman', serif;
  font-weight: 400;
  font-size: 39px;
  line-height: 1.1;
  letter-spacing: -1.3px;
  margin: 0;
}
.lead {
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0 0;
  line-height: 1.6;
}
.section-heading > .button {
  margin-top: 8px;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid #dce1ed;
  border-bottom: 1px solid #dce1ed;
  padding: 23px 0 24px;
}
.summary-stat {
  padding: 0 30px;
  border-right: 1px solid var(--line);
}
.summary-stat:first-child {
  padding-left: 0;
}
.summary-stat:last-child {
  border-right: 0;
}
.stat-label {
  font-size: 11px;
  font-weight: 550;
  display: flex;
  align-items: center;
  gap: 7px;
  color: #58627a;
}
.stat-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.gain-dot {
  background: #2864a7;
}
.expense-dot {
  background: #c26379;
}
.stat-value {
  display: block;
  font-weight: 500;
  font-size: 32px;
  line-height: 1.3;
  letter-spacing: -1.1px;
  font-variant-numeric: tabular-nums;
  margin: 12px 0 5px;
}
.gains-value {
  color: var(--accent);
}
.stat-caption {
  font-size: 10px;
  color: #667085;
}
.records-section {
  margin-top: 37px;
}
.records-section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 17px;
}
.records-section-heading h2 {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.15px;
}
.count-pill {
  font-size: 10px;
  color: #5f6884;
  border: 1px solid #dcdff1;
  background: #eef0f9;
  border-radius: 20px;
  padding: 3px 7px;
  font-weight: 450;
}
.scope-note {
  font-size: 10px;
  color: #667085;
}
.filter-bar {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
}
.search-field {
  position: relative;
  flex: 1;
  min-width: 150px;
}
.search-field svg {
  position: absolute;
  left: 12px;
  top: 12px;
  width: 15px;
  height: 15px;
  color: #707a92;
  pointer-events: none;
}
.filter-bar input,
.filter-bar select {
  height: 39px;
  border: 1px solid #dce1ed;
  border-radius: 7px;
  background: #ffffff;
  color: #59637e;
  font-size: 11px;
  width: 100%;
  padding: 0 11px;
}
.search-field input {
  padding-left: 36px;
}
.filter-field {
  width: 137px;
  flex: none;
}
.filter-field select {
  padding-right: 26px;
}
.month-field {
  width: 148px;
}
.month-field input {
  padding-right: 8px;
}
.reset-filters {
  border: 0;
  background: transparent;
  padding: 7px 6px;
  font-size: 11px;
  color: #626d86;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.reset-filters:hover {
  color: var(--accent);
}
.records-surface {
  background: var(--surface);
  border: 1px solid #dce1ed;
  border-radius: 10px;
  overflow: hidden;
}
.table-scroll {
  overflow-x: auto;
  scrollbar-width: thin;
}
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 850px;
  text-align: left;
}
thead {
  background: #f5f6fc;
}
th {
  font-size: 10px;
  font-weight: 600;
  color: #667085;
  padding: 13px 14px;
  border-bottom: 1px solid var(--line);
}
td {
  font-size: 11px;
  padding: 17px 14px;
  border-bottom: 1px solid #edf0f7;
  color: #4e5972;
  vertical-align: middle;
  line-height: 1.6;
  overflow-wrap: anywhere;
}
th.date-column,
td.date-cell {
  padding-left: 12px;
  width: 124px;
}
th.type-column {
  width: 90px;
}
th.category-column {
  width: 100px;
}
th.merchant-column {
  width: 165px;
}
th.amount-column {
  width: 118px;
  text-align: right;
}
th.actions-column {
  width: 110px;
}
td.amount,
td.amount-cell {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  white-space: nowrap;
}
.positive,
.gain-amount {
  color: var(--accent);
}
.negative,
.expense-amount {
  color: var(--expense);
}
.kind-badge,
.type-badge {
  display: inline-flex;
  align-items: center;
  border-radius: 5px;
  padding: 3px 7px;
  font-size: 10px;
  line-height: 1.4;
  background: var(--accent-pale);
  color: var(--accent);
}
.kind-badge.expense,
.type-badge.expense {
  background: var(--expense-pale);
  color: var(--expense);
}
.kind-badge.gain,
.type-badge.gain {
  background: var(--accent-pale);
  color: var(--accent);
}
.row-actions {
  display: flex;
  justify-content: flex-end;
  gap: 2px;
}
.row-actions .icon-button {
  width: 26px;
  height: 29px;
  padding: 5px;
}
.row-actions .icon-button svg {
  width: 14px;
  height: 14px;
}
.row-actions .delete:hover {
  color: var(--red);
  background: #fceaf0;
}
.note-cell {
  color: #667085;
}
.muted {
  color: #707a92;
}
.empty-state {
  text-align: center;
  padding: 47px 24px 49px;
  min-height: 334px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.empty-illustration {
  position: relative;
  width: 88px;
  height: 80px;
  margin-bottom: 18px;
}
.empty-paper {
  position: absolute;
  left: 14px;
  top: 0;
  background: #fff;
  border: 1px solid #d5d8ed;
  border-radius: 6px;
  transform: rotate(-7deg);
  width: 60px;
  height: 75px;
  padding: 14px 10px;
  box-shadow: 4px 5px 0 #eceafa;
}
.paper-heading {
  height: 3px;
  width: 22px;
  display: block;
  background: #c7c3ec;
  margin-bottom: 11px;
}
.paper-row {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-bottom: 7px;
}
.paper-row i {
  height: 2px;
  width: 22px;
  background: #e0ddf6;
}
.paper-row b {
  height: 2px;
  flex: 1;
  background: #c7c3ec;
}
.empty-plus {
  position: absolute;
  right: 0;
  bottom: 0;
  background: #eeebfd;
  border: 3px solid white;
  color: #6656b9;
  border-radius: 50%;
  font-size: 22px;
  width: 32px;
  height: 32px;
  line-height: 25px;
  font-weight: 300;
}
.empty-state h3 {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 23px;
  font-weight: 400;
  letter-spacing: -0.5px;
  margin: 0 0 9px;
}
.empty-state p {
  font-size: 11px;
  line-height: 1.8;
  color: #667085;
  margin: 0 0 21px;
}
.empty-state .button {
  font-size: 11px;
  padding: 8px 13px;
}
.empty-state .button svg {
  width: 15px;
  height: 15px;
}
.table-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-top: 1px solid #e4e7f1;
  padding: 10px 16px 10px 22px;
  font-size: 10px;
  color: #667085;
  min-height: 53px;
  background: #ffffff;
}
.pagination {
  display: flex;
  align-items: center;
  gap: 9px;
}
.pagination .icon-button {
  width: 26px;
  height: 28px;
  border-color: #e0e3ef;
  background: white;
}
.pagination .icon-button svg {
  width: 13px;
  height: 13px;
}
.workspace-footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  color: #667085;
  font-size: 10px;
  margin-top: 23px;
  text-align: center;
}
.workspace-footer svg {
  width: 12px;
  height: 12px;
  flex: none;
}
.workspace-footer p {
  margin: 0;
  line-height: 1.7;
}
dialog {
  border: 1px solid #d9dcef;
  border-radius: 15px;
  background: #ffffff;
  color: var(--ink);

  $2("file-input").addEventListener("change", () => {
    const file = $2("file-input").files[0];
    $2("file-input").value = "";
    if (file) fileAction(() => acceptFile(file));
  });
  function fileName(value) {
    let name = String((value === "Untitled" ? "" : value) || "recording-records.json").trim().replace(/[\\/:*?"<>|]/g, "-");
    if (!name.toLowerCase().endsWith(".json")) name += ".json";
    return name || "recording-records.json";
  }
  async function save({ name, copy = false, direct = false } = {}) {
    return fileAction(async () => {
      const snapshot = validateDocument(session.snapshot()), status = session.getStatus();
      let handle = copy ? null : status.handle;
      if (direct && !handle)
        handle = await globalThis.showSaveFilePicker({
          suggestedName: fileName(name || status.fileName),
          types: [{ description: "Recording JSON", accept: { "application/json": [".json"] } }]
        });
      const text2 = serializeDocumentJSON(snapshot);
      if (handle && !copy) {
        await writeDirectFile(handle, text2);
        session.markSaved({ name: handle.name, fileHandle: handle, savedDocument: snapshot });
        ctx.notify("JSON saved.");
      } else {
        const target = fileName(name || status.fileName);
        downloadText(text2, target);
        session.markSaved({ name: target, downloaded: true });
        ctx.notify(
          "JSON copy downloaded. Keep it in your synced data folder; the browser cannot verify where a download was stored."
        );
      }
      return true;
    });
  }
  $2("save-file").addEventListener("click", () => save());
  $2("download-json").addEventListener("click", () => save({ copy: true }));
  $2("save-as").addEventListener("click", () => {
    const view = showForm({
      title: "Save a JSON copy",
      content: field("Filename", "filename", fileName(session.getStatus().fileName), {
        required: true
      }),
      submitLabel: "Download JSON",
      onSave: async (form) => {
        if (await save({ name: new FormData(form).get("filename"), copy: true })) view.dialog.close();
      }
    });
  });
  $2("export-csv").addEventListener("click", () => {
    try {
      downloadText(
        toCSV(validateDocument(session.snapshot())),
        "recording-entries.csv",
        "text/csv;charset=utf-8"
      );
      ctx.notify(
        "All Gain/Expense entries exported to CSV. Transfers and investment principal are excluded."
      );
    } catch (error) {
      ctx.notify(error.message, true);
    }
  });
  if ($2("open-direct")) {
    $2("open-direct").hidden = !globalThis.showOpenFilePicker;
    $2("open-direct").addEventListener(
      "click",
      () => fileAction(async () => {
        const { handle, file } = await chooseDirectFile();
        await acceptFile(file, handle);
      })
    );
  }
  if ($2("save-direct")) {
    $2("save-direct").hidden = !globalThis.showSaveFilePicker;
    $2("save-direct").addEventListener("click", () => save({ direct: true }));
  }
  window.addEventListener("beforeunload", (event) => {
    if (session.getStatus().dirty) {
      event.preventDefault();
      event.returnValue = "";
    }
  });
  session.subscribe(render);
  initialized = true;
  navigate("accounts");
})();
</script></body>
</html>
