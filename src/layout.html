<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Finance Records — a local, file-based recording system." />
    <meta name="theme-color" content="#252941" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Finance Records</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/recording/app.mjs"></script>
  </head>
  <body class="recording-page">
    <a class="skip-link" href="#main" data-i18n="shell.skip">Skip to main content</a>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><path d="M6 18V6h12M6 12h9M11 18h7" /></svg
          ></span>
          <span class="brand-name" data-i18n="shell.title">Finance Records</span>
        </div>
        <div class="header-actions">
          <span id="ledger-currency" class="currency-label">USD</span
          ><span class="header-divider" aria-hidden="true"></span
          ><button
            id="new-file"
            aria-label="New file"
            title="New file"
            data-i18n-aria-label="shell.newFile"
            data-i18n-title="shell.newFile"
            class="button button-quiet"
            type="button"
          >
            <svg class="header-file-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 12v6M9 15h6"
              /></svg
            ><span class="header-file-label" data-i18n="shell.newFile">New file</span></button
          ><button
            id="open-file"
            aria-label="Open JSON"
            title="Open JSON"
            data-i18n-aria-label="shell.openJSON"
            data-i18n-title="shell.openJSON"
            class="button button-outline"
            type="button"
          >
            <svg class="header-file-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h6l2 2h10l-3 11H3zM3 7V4h7l2 3M3 12h17" /></svg
            ><span class="header-file-label" data-i18n="shell.openJSON">Open JSON</span>
          </button>
          <label class="header-language-control"
            ><span class="visually-hidden" data-i18n="shell.language">Interface language</span
            ><select
              id="language-select"
              aria-label="Interface language"
              data-i18n-aria-label="shell.language"
            >
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
            </select></label
          >
          <a
            id="github-link"
            class="button button-outline github-link"
            href="https://github.com/BidaGu/finRecords"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub repository (opens in a new tab)"
            data-i18n-aria-label="shell.github"
            title="GitHub repository (opens in a new tab)"
            data-i18n-title="shell.github"
          >
            <span class="github-label">GitHub</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15 3h6v6M21 3l-9 9M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>
    <main id="main" class="workspace">
      <section
        class="file-bar"
        aria-label="Current data file"
        data-i18n-aria-label="shell.currentFile"
      >
        <div class="file-details">
          <span class="file-icon" aria-hidden="true">▤</span>
          <div class="file-copy">
            <div class="file-heading">
              <span id="file-name">Untitled</span
              ><span id="save-state" class="save-status" role="status" aria-live="polite"
                >Not saved</span
              >
            </div>
            <p id="storage-hint">Choose a data file or start a new ledger.</p>
          </div>
        </div>
        <div class="file-actions">
          <button
            id="save-file"
            class="button button-compact button-ink"
            type="button"
            data-i18n="shell.save"
          >
            Save
          </button>
          <details class="file-menu">
            <summary
              class="button button-compact button-outline"
              aria-label="More file actions"
              data-i18n-aria-label="shell.moreFileActions"
            >
              •••
            </summary>
            <div class="menu-panel">
              <button id="save-as" type="button">
                <span class="file-action-title" data-i18n="shell.saveAs">Save as…</span
                ><span data-i18n="shell.filenameHelp">Choose a download filename</span></button
              ><button id="download-json" type="button">
                <span class="file-action-title" data-i18n="shell.downloadCopy"
                  >Download JSON copy</span
                ><span data-i18n="shell.editableFile">Editable data file</span></button
              ><button id="export-csv" type="button">
                <span class="file-action-title" data-i18n="shell.exportCSV">Export CSV</span
                ><span data-i18n="shell.csvHelp">All entries · Open in Excel</span></button
              ><button id="open-direct" type="button" hidden>
                <span class="file-action-title" data-i18n="shell.openDirect"
                  >Open for direct editing…</span
                ><span data-i18n="shell.supportedBrowsers">Supported browsers only</span></button
              ><button id="save-direct" type="button" hidden>
                <span class="file-action-title" data-i18n="shell.saveDirect"
                  >Save directly to file…</span
                ><span data-i18n="shell.supportedBrowsers">Supported browsers only</span>
              </button>
            </div>
          </details>
        </div>
      </section>
      <input id="file-input" type="file" accept=".json,application/json" hidden />
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div
        class="workspace-tabs"
        role="tablist"
        aria-label="Ledger section"
        data-i18n-aria-label="shell.ledgerSection"
      >
        <button
          id="tab-accounts"
          class="workspace-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="accounts-panel"
          data-i18n="shell.accounts"
        >
          Accounts &amp; Assets</button
        ><button
          id="tab-records"
          class="workspace-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="records-panel"
          tabindex="-1"
          data-i18n="shell.records"
        >
          Income &amp; Expenses
        </button>
        <button
          id="tab-analysis"
          class="workspace-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="analysis-panel"
          tabindex="-1"
          data-i18n="shell.analysis"
        >
          Analysis
        </button>
        <button
          id="tab-calculators"
          class="workspace-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="calculators-panel"
          tabindex="-1"
          data-i18n="shell.calculators"
        >
          Calculators
        </button>
      </div>
      <section
        id="accounts-panel"
        class="workspace-panel cash-workspace"
        role="tabpanel"
        aria-labelledby="tab-accounts"
      >
        <div
          class="calculator-tabs account-tabs"
          role="tablist"
          aria-label="Accounts"
          data-i18n-aria-label="shell.accountTabs"
        >
          <button
            id="account-tab-balances"
            class="calculator-tab account-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="account-balances-panel"
            data-i18n="shell.balances"
          >
            Balances</button
          ><button
            id="account-tab-transfers"
            class="calculator-tab account-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="account-transfers-panel"
            tabindex="-1"
            data-i18n="shell.transfers"
          >
            Transfers</button
          ><button
            id="account-tab-statements"
            class="calculator-tab account-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="account-statements-panel"
            tabindex="-1"
            data-i18n="shell.statements"
          >
            Statements
          </button>
        </div>
        <section
          id="account-balances-panel"
          class="account-panel"
          role="tabpanel"
          aria-labelledby="account-tab-balances"
        >
          <div id="balances-content"></div>
        </section>
        <section
          id="account-transfers-panel"
          class="account-panel"
          role="tabpanel"
          aria-labelledby="account-tab-transfers"
          hidden
        >
          <div id="transfers-content"></div>
        </section>
        <section
          id="account-statements-panel"
          class="account-panel"
          role="tabpanel"
          aria-labelledby="account-tab-statements"
          hidden
        >
          <div id="statements-content"></div>
        </section>
      </section>
      <section
        id="records-panel"
        class="workspace-panel"
        role="tabpanel"
        aria-labelledby="tab-records"
        hidden
      >
        <section
          id="analysis-presets-bar"
          class="analysis-presets-bar"
          aria-label="Analysis presets"
          data-i18n-aria-label="shell.analysisPresets"
        >
          <div id="selection-presets-content"></div>
        </section>
        <div id="records-content"></div>
      </section>
      <section
        id="analysis-panel"
        class="workspace-panel"
        role="tabpanel"
        aria-labelledby="tab-analysis"
        hidden
      >
        <div
          class="calculator-tabs analysis-tabs"
          role="tablist"
          aria-label="Analysis section"
          data-i18n-aria-label="shell.analysisSection"
        >
          <button
            id="analysis-tab-accounts"
            class="calculator-tab analysis-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="analysis-accounts-panel"
            data-i18n="shell.accounts"
          >
            Accounts &amp; Assets
          </button>
          <button
            id="analysis-tab-records"
            class="calculator-tab analysis-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="analysis-records-panel"
            tabindex="-1"
            data-i18n="shell.records"
          >
            Income &amp; Expenses
          </button>
        </div>
        <section
          id="analysis-accounts-panel"
          role="tabpanel"
          aria-labelledby="analysis-tab-accounts"
        >
          <div id="account-analysis-content"></div>
        </section>
        <section
          id="analysis-records-panel"
          role="tabpanel"
          aria-labelledby="analysis-tab-records"
          hidden
        >
          <div id="entry-analysis-content"></div>
        </section>
      </section>
      <section
        id="calculators-panel"
        class="workspace-panel"
        role="tabpanel"
        aria-labelledby="tab-calculators"
        hidden
      >
        <div id="calculator-workspace-content"></div>
      </section>
      <footer class="workspace-footer">
        <p data-i18n="shell.footer">
          Your records stay in this browser tab until saved to JSON. Keep financial data outside
          public hosting.
        </p>
      </footer>
    </main>
  </body>
</html>
