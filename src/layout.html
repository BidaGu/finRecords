<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Finance Records — a local, file-based recording system." />
    <meta name="theme-color" content="#252941" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Finance Records</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/recording/app.mjs"></script>
  </head>
  <body class="recording-page">
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><path d="M6 18V6h12M6 12h9M11 18h7" /></svg
          ></span>
          <span class="brand-name">Finance Records</span>
        </div>
        <div class="header-actions">
          <span class="currency-label">USD</span
          ><span class="header-divider" aria-hidden="true"></span
          ><button id="new-file" class="button button-quiet" type="button">New file</button
          ><button id="open-file" class="button button-outline" type="button">Open JSON</button>
        </div>
      </div>
    </header>
    <main id="main" class="workspace">
      <section class="file-bar" aria-label="Current data file">
        <div class="file-details">
          <span class="file-icon" aria-hidden="true">▤</span>
          <div class="file-copy">
            <div class="file-heading">
              <span id="file-name">Untitled</span
              ><span id="save-state" class="save-status" role="status" aria-live="polite"
                >Not saved</span
              >
            </div>
            <p id="storage-hint">Choose a data file or start a new ledger.</p>
          </div>
        </div>
        <div class="file-actions">
          <button id="save-file" class="button button-compact button-ink" type="button">
            Save
          </button>
          <details class="file-menu">
            <summary class="button button-compact button-outline" aria-label="More file actions">
              •••
            </summary>
            <div class="menu-panel">
              <button id="save-as" type="button">
                Save as…<span>Choose a download filename</span></button
              ><button id="download-json" type="button">
                Download JSON copy<span>Editable data file</span></button
              ><button id="export-csv" type="button">
                Export CSV<span>All entries · Open in Excel</span></button
              ><button id="open-direct" type="button" hidden>
                Open for direct editing…<span>Supported browsers only</span></button
              ><button id="save-direct" type="button" hidden>
                Save directly to file…<span>Supported browsers only</span>
              </button>
            </div>
          </details>
        </div>
      </section>
      <input id="file-input" type="file" accept=".json,application/json" hidden />
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div class="workspace-tabs" role="tablist" aria-label="Ledger section">
        <button
          id="tab-accounts"
          class="workspace-tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="accounts-panel"
        >
          Accounts &amp; Assets</button
        ><button
          id="tab-records"
          class="workspace-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="records-panel"
          tabindex="-1"
        >
          Income &amp; Expenses
        </button>
      </div>
      <section
        id="accounts-panel"
        class="workspace-panel cash-workspace"
        role="tabpanel"
        aria-labelledby="tab-accounts"
      >
        <div class="calculator-tabs account-tabs" role="tablist" aria-label="Accounts">
          <button
            id="account-tab-balances"
            class="calculator-tab account-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="account-balances-panel"
          >
            Balances</button
          ><button
            id="account-tab-transfers"
            class="calculator-tab account-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="account-transfers-panel"
            tabindex="-1"
          >
            Transfers</button
          ><button
            id="account-tab-statements"
            class="calculator-tab account-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="account-statements-panel"
            tabindex="-1"
          >
            Statements
          </button>
        </div>
        <section
          id="account-balances-panel"
          class="account-panel"
          role="tabpanel"
          aria-labelledby="account-tab-balances"
        >
          <div id="balances-content"></div>
        </section>
        <section
          id="account-transfers-panel"
          class="account-panel"
          role="tabpanel"
          aria-labelledby="account-tab-transfers"
          hidden
        >
          <div id="transfers-content"></div>
        </section>
        <section
          id="account-statements-panel"
          class="account-panel"
          role="tabpanel"
          aria-labelledby="account-tab-statements"
          hidden
        >
          <div id="statements-content"></div>
        </section>
      </section>
      <section
        id="records-panel"
        class="workspace-panel"
        role="tabpanel"
        aria-labelledby="tab-records"
        hidden
      >
        <section
          id="analysis-presets-bar"
          class="analysis-presets-bar"
          aria-label="Analysis presets"
        >
          <div id="selection-presets-content"></div>
        </section>
        <div id="records-content"></div>
      </section>
      <footer class="workspace-footer">
        <p>
          Your records stay in this browser tab until saved to JSON. Keep financial data outside
          public hosting.
        </p>
      </footer>
    </main>
  </body>
</html>
