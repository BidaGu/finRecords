    <style>:root {
  color-scheme: light;
  --paper: #f4f5fb;
  --surface: #fff;
  --ink: #252941;
  --muted: #667085;
  --line: #dce1ed;
  --accent: #5148b5;
  --accent-dark: #40368f;
  --accent-pale: #eeecfb;
  --expense: #ad465f;
  --expense-pale: #fbeef1;
  --red: #b23d55;
  --gain: #2864a7;
  --gain-pale: #eaf2fb;
  --radius: 9px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-size: 14px;
  font-synthesis: none;
}
.inline-category-button {
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 11px;
  padding: 5px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.records-section .filter-bar {
  display: block;
}
.filter-main {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) minmax(120px, 160px) minmax(140px, 200px);
  gap: 9px;
}
.filter-main .search-field {
  min-width: 0;
}
.filter-main > .filter-field {
  width: auto;
  min-width: 0;
}
.filter-dates {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 11px;
}
.filter-dates > .month-field {
  flex: 0 0 148px;
  width: 148px;
  min-width: 0;
}
.filter-dates label {
  display: block;
  font-size: 10px;
  font-weight: 550;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 6px;
}
.date-range-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  flex: 0 1 337px;
  min-width: 0;
}
.date-filter-field {
  min-width: 0;
}
.filter-dates > .reset-filters {
  flex: none;
  align-self: flex-end;
  margin: 0 0 0 auto;
  padding: 11px 6px;
  line-height: 17px;
}
.date-range-fields input[aria-invalid='true'] {
  border-color: var(--red);
  background: #fff9fa;
}
#date-range-error {
  margin: -2px 0 13px;
}
@media (max-width: 600px) {
  .filter-main {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }
  .filter-main > .search-field {
    grid-column: 1 / -1;
  }
  .filter-dates {
    gap: 7px;
    margin-top: 10px;
  }
  .filter-dates > .month-field {
    flex: 1 1 100px;
    width: auto;
  }
  .date-range-fields {
    flex: 2 1 210px;
    gap: 7px;
  }
  .filter-dates label {
    font-size: 9px;
    margin-bottom: 5px;
  }
  .filter-dates input {
    padding: 0 6px;
  }
  .filter-dates > .reset-filters {
    font-size: 10px;
    padding: 5px 4px;
    line-height: 17px;
  }
  #date-range-error {
    font-size: 10px;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
summary,
a {
  -webkit-tap-highlight-color: transparent;
}
button,
summary {
  cursor: pointer;
}
button {
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.4;
}
button svg,
summary svg {
  width: 18px;
  height: 18px;
  flex: none;
}
svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.55;
  stroke-linecap: round;
  stroke-linejoin: round;
}
input,
select,
textarea {
  min-width: 0;
}
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
button:focus-visible,
summary:focus-visible,
a:focus-visible {
  outline: 3px solid #8d83e4;
  outline-offset: 3px;
}
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-offset: 0;
}
input::placeholder,
textarea::placeholder {
  color: #667085;
  opacity: 1;
}
[hidden] {
  display: none !important;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: absolute;
  top: -100px;
  left: 20px;
  background: var(--accent);
  color: white;
  padding: 12px;
  z-index: 100;
}
.skip-link:focus {
  top: 12px;
}
.app-header {
  background: #ffffff;
  border-bottom: 1px solid var(--line);
}
.header-inner {
  max-width: 1240px;
  margin: auto;
  min-height: 88px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 17px 36px;
}
.brand {

}
.brand-mark {

  border-radius: 8px 8px 16px 8px;
  background: var(--accent);
  color: #f3f1ff;
}
.brand-mark svg {

  height: 27px;

}
.brand-name {
  display: block;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.5px;
}
.brand-caption {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.github-link svg {
  width: 16px;
  height: 16px;
  flex: none;
}
.header-file-icon {
  display: none;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}
.header-language-control select {
  width: 96px;
  min-height: 38px;
  padding: 7px 5px;
  border: 1px solid #59617e;
  border-radius: 7px;
  color: white;
  background: #373e5e;
  font-size: 11px;
}
.header-language-control select:disabled {
  opacity: 0.5;
}
.header-language-control option {
  color: #252941;
  background: white;
}
.menu-panel button .file-action-title {
  color: inherit;
  font-size: inherit;
}
:lang(zh-CN) {
  font-family:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
.currency-label {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.header-divider {

  margin: 0 7px;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 11px 16px;
  font-size: 13px;
  line-height: 19px;
  font-weight: 550;
  text-decoration: none;
  white-space: nowrap;

    background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
.button:active:not(:disabled) {
  transform: translateY(1px);
}
.button-primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
  box-shadow: 0 1px 2px #322b791a;
}
.button-primary:hover {
  background: var(--accent-dark);
}
.button-outline {
  background: var(--surface);
  border-color: #d8ddeb;
}
.button-outline:hover {
  background: #f0effb;
  border-color: #b8b6db;
}
.button-quiet {
  background: transparent;
}
.button-quiet:hover {
  background: #e9eaf5;
}
.button-ink {
  color: white;
  background: var(--ink);
}
.button-ink:hover {
  background: #3c4260;
}
.button-compact {
  padding: 8px 12px;
  font-size: 12px;
}
.button-danger {
  color: white;

}
.button-danger:hover {
  background: #923048;
}
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  width: 32px;
  height: 32px;
  padding: 6px;
  color: var(--muted);
}
.icon-button:hover:not(:disabled) {
  background: var(--accent-pale);
  color: var(--accent);
}
.workspace {
  max-width: 1240px;
  padding: 28px 36px 20px;
  margin: auto;
}
.file-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #f8f8fe;
  padding: 13px 16px;
}
.file-details {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.file-icon {
  color: #71799a;
  flex: none;
}
.file-icon svg {
  display: block;
  width: 25px;
  height: 29px;
}
.file-copy {
  min-width: 0;
}
.file-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
#file-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
  max-width: 430px;
}
.save-status {
  font-size: 10px;
  font-weight: 550;
  white-space: nowrap;
  padding: 3px 7px;
  border-radius: 5px;
  background: #e9effa;
  color: #51648a;
}
.save-status.unsaved,
.save-status.dirty {
  background: #fff0db;
  color: #885c18;
}
.file-copy p {
  font-size: 11px;

  margin: 4px 0 0;
  line-height: 1.5;
}
.file-actions {
  display: flex;
  gap: 7px;
  align-items: center;
  flex: none;
}
.file-menu {
  position: relative;
}
.file-menu summary {
  list-style: none;
}
.file-menu summary::-webkit-details-marker {
  display: none;
}
.file-menu summary svg {
  width: 16px;
  height: 19px;
}
.menu-panel {
  position: absolute;
  right: 0;
  top: calc(100% + 7px);
  width: 185px;
  z-index: 10;
  background: white;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 5px;
  box-shadow: 0 10px 30px #22264a14;
}
.menu-panel button {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 5px;
  text-align: left;
  background: white;
  padding: 10px 11px;
  font-size: 12px;
  font-weight: 550;
}
.menu-panel button:hover {
  background: var(--accent-pale);
}
.menu-panel span {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 3px;
}
.message {
  margin-top: 16px;
  padding: 12px 14px;
  border: 1px solid #d6d2f4;
  border-radius: 8px;
  color: var(--accent);
  background: #f0eefc;
  font-size: 12px;
  line-height: 1.5;
}
.message.error {
  background: #fff0f3;
  border-color: #edc4ce;
  color: #9c3450;
}
.message.warning {
  background: #fff6e8;
  border-color: #ead3ad;
  color: #855b20;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin: 40px 0 31px;
}
.eyebrow {
  font-size: 9px;
  line-height: 1.5;
  font-weight: 650;
  letter-spacing: 0.14em;
  color: #667085;
  margin: 0 0 9px;
}
h1,
h2,
h3,
p {
  overflow-wrap: break-word;
}
h1 {
  font-family: Georgia, 'Times New Roman', serif;
  font-weight: 400;
  font-size: 39px;
  line-height: 1.1;
  letter-spacing: -1.3px;
  margin: 0;
}
.lead {
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0 0;
  line-height: 1.6;
}
.section-heading > .button {
  margin-top: 8px;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid #dce1ed;
  border-bottom: 1px solid #dce1ed;
  padding: 23px 0 24px;
}
.summary-stat {
  padding: 0 30px;
  border-right: 1px solid var(--line);
}
.summary-stat:first-child {
  padding-left: 0;
}
.summary-stat:last-child {
  border-right: 0;
}
.stat-label {
  font-size: 11px;
  font-weight: 550;
  display: flex;
  align-items: center;
  gap: 7px;

}
.stat-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.gain-dot {

}
.expense-dot {
  background: #c26379;
}
.stat-value {
  display: block;
  font-weight: 500;
  font-size: 32px;
  line-height: 1.3;
  letter-spacing: -1.1px;
  font-variant-numeric: tabular-nums;
  margin: 12px 0 5px;
}
.gains-value {
  color: var(--accent);
}
.stat-caption {
  font-size: 10px;

}
.records-section {

}
.records-section-heading {
  display: flex;

}
.records-section-heading h2 {

}
.count-pill {

.scope-note {

.filter-bar {

}
.search-field {

.filter-bar input,
.filter-bar select {

  width: 100%;

.search-field input {

}
.filter-field {

.filter-field select {

}
.month-field {

}
.month-field input {
  padding-right: 8px;
}
.reset-filters {

  font-size: 11px;

.reset-filters:hover {

.records-surface {

.table-scroll {

}

        const target = fileName(name || (status.isUntitled ? "" : status.fileName));
        downloadText(text2, target);
        session.markSaved({ name: target, downloaded: true });
        ctx.notify({
          code: "app.copyDownloaded",
          message: "JSON copy downloaded. Keep it in your synced data folder; the browser cannot verify where a download was stored."
        });
      }
      return true;
    });
  }
  $2("save-file").addEventListener("click", () => save());
  $2("download-json").addEventListener("click", () => save({ copy: true }));
  $2("save-as").addEventListener("click", () => {
    const view = showForm({
      presentation: presentationFor(ledgerCurrency),
      title: t("app.saveCopyTitle", "Save a JSON copy"),
      content: field(
        t("app.filename", "Filename"),
        "filename",
        fileName(session.getStatus().isUntitled ? "" : session.getStatus().fileName),
        {
          required: true
        }
      ),
      submitLabel: t("app.downloadJSON", "Download JSON"),
      onSave: async (form) => {
        if (await save({ name: new FormData(form).get("filename"), copy: true })) view.dialog.close();
      }
    });
  });
  $2("export-csv").addEventListener("click", () => {
    try {
      downloadText(
        toCSV(validateDocument(session.snapshot()), { t }),
        "recording-entries.csv",
        "text/csv;charset=utf-8"
      );
      ctx.notify({
        code: "app.csvExported",
        message: "All Gain/Expense entries exported to CSV. Transfers and investment principal are excluded."
      });
    } catch (error) {
      ctx.notify(error, true);
    }
  });
  if ($2("open-direct")) {
    $2("open-direct").hidden = !globalThis.showOpenFilePicker;
    $2("open-direct").addEventListener(
      "click",
      () => fileAction(async () => {
        const { handle, file } = await chooseDirectFile({
          description: t("app.fileType", "Recording JSON")
        });
        await acceptFile(file, handle);
      })
    );
  }
  if ($2("save-direct")) {
    $2("save-direct").hidden = !globalThis.showSaveFilePicker;
    $2("save-direct").addEventListener("click", () => save({ direct: true }));
  }
  window.addEventListener("beforeunload", (event) => {
    if (session.getStatus().dirty) {
      event.preventDefault();
      event.returnValue = "";
    }
  });
  session.subscribe(render);
  localization.subscribe(refreshLanguage);
  $2("language-select")?.addEventListener("change", () => {
    if (session.getStatus().busy || document.querySelector("dialog[open]") || calculators.isBusy?.()) {
      $2("language-select").value = localization.getLanguage();
      return;
    }
    localization.setLanguage($2("language-select").value);
  });
  if (typeof globalThis.MutationObserver === "function")
    new globalThis.MutationObserver(updateLanguageAvailability).observe(document.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["open", "aria-busy"]
    });
  initialized = true;
  navigate("accounts");
})();
</script></body>
</html>
